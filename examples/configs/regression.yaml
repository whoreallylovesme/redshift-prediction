# 442 measured cases shipped with scikit-learn. Runs offline.
name: Diabetes progression
output: runs/diabetes
workers: 2
dataset:
  source: {_target_: sklearn.datasets.load_diabetes, as_frame: true, scaled: false}
  target: target
  features: [age, sex, bmi, bp, s1, s2, s3, s4, s5, s6]
  seed: 42
methods:
  ridge:
    kind: tabular
    model: ridge
    params: {alpha: 1.0}
  catboost:
    kind: tabular
    model: catboost
    params: {iterations: 60, depth: 4}
