[project]
name = "astro"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.0",
    "torch>=2.0",
    "catboost>=1.2.10",
    "click>=8.3.1",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "pyarrow>=23.0.1",
    "pygam>=0.12.0",
    "pyyaml>=6.0.3",
    "s3fs>=2026.2.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "h5py>=3.16.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "opencv-python-headless>=4.13.0.92",
    "timm>=1.0.26",
    "prefect>=3.6.25",
    "smplotlib>=1.0.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3.0",
    "lightning>=2.6.5",
    "jinja2>=3.1.6",
    "plotly>=6.5.2",
    "kaleido>=1.4.0",
    "hydra-core>=1.3.6",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "types-pyyaml>=6.0.12.20250915", # для mypy
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lib*", "runtime*", "tools*"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["runs", "prepared", "useful_info"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # неиспользуемые переменные, ошибки импорта
    "I",  # сортировка импортов
    "B",  # ловит потенциальные баги
    "UP", # обновляет старый синтаксис до современного
]

[tool.mypy]
python_version = "3.13"
pretty = true # Красивый вывод ошибок
show_error_codes = true # Показывать коды ошибок
check_untyped_defs = true # Проверять функции без аннотаций типов
disallow_incomplete_defs = true # Запрещать частично аннотированные функции
no_implicit_optional = true # Запрещает неявный Optional
warn_return_any = true # Предупреждать если функция возвращает Any
warn_unused_ignores = true # Предупреждать если игнор типов не нужен
ignore_missing_imports = true # Игнорировать отсутствующие типы у сторонних библиотек
disallow_untyped_defs = true # Запрещать функции без аннотаций

exclude = "^(runs|prepared|useful_info)/"
