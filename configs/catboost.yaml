split:
  test_size: 0.2
  val_size: 0.25
  shuffle: true
  random_seed: 42

preprocess:
  drop_star_spectype: true
  drop_gaia_stars: true
  drop_unnamed: true

estimator: |
  from sklearn.pipeline import Pipeline
  from catboost import CatBoostRegressor

  estimator = Pipeline([
    ("model", CatBoostRegressor(
      loss_function="RMSE",
      random_seed=42,
      verbose=False,
      allow_writing_files=False,
      thread_count=-1
    ))
  ])

estimator_params: {}

hyperopt:
  enabled: true
  cv: 3
  scoring: "neg_root_mean_squared_error"
  n_jobs: 1
  verbose: 1

param_grid:
  "model__iterations": [300, 800]
  "model__depth": [6, 8]
  "model__learning_rate": [0.05, 0.1]
  "model__l2_leaf_reg": [3, 10]
