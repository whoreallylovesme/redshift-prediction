model_type: pytorch

estimator: |
  import timm

  model = timm.create_model(
      "vit_tiny_patch16_224", pretrained=True, in_chans=4, num_classes=1,
  )

  for name, param in model.named_parameters():
      if not name.startswith("head"):
          param.requires_grad = False

  estimator = model

data_dir: teddyA_imgs
catalog: useful_info/teddy_happy/Teddy/teddy_A
norm_from: teddyA_imgs

train:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  freeze_epochs: 3
  train_ratio: 0.8
  seed: 42
  num_workers: 4
  weighted_sampling: true
  z_weight_alpha: 2.0
  label_noise: 0.0
  head_prefix: head
