model_type: pytorch

estimator: |
  import torch
  import torch.nn as nn
  from torchvision.models import EfficientNet_B0_Weights, efficientnet_b0

  model = efficientnet_b0(weights=EfficientNet_B0_Weights.DEFAULT)

  old_conv = model.features[0][0]
  new_conv = nn.Conv2d(4, 32, kernel_size=3, stride=2, padding=1, bias=False)
  with torch.no_grad():
      new_conv.weight[:, :3] = old_conv.weight
      new_conv.weight[:, 3] = old_conv.weight.mean(dim=1)
  model.features[0][0] = new_conv

  in_features = model.classifier[1].in_features
  model.classifier = nn.Sequential(
      nn.Dropout(0.2),
      nn.Linear(in_features, 256),
      nn.ReLU(),
      nn.Dropout(0.3),
      nn.Linear(256, 1),
  )

  for name, param in model.named_parameters():
      if not name.startswith("classifier"):
          param.requires_grad = False

  estimator = model

data_dir: teddyA_imgs
catalog: datasets/teddy_happy_orig/Teddy/teddy_A
norm_from: teddyA_imgs

train:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  freeze_epochs: 3
  train_ratio: 0.8
  seed: 42
  num_workers: 4
  weighted_sampling: true
  z_weight_alpha: 2.0
  label_noise: 0.0
  head_prefix: classifier
