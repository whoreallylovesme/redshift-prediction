name: Tabular photo-z
task: photoz.report:PHOTOZ
output: runs/tabular
dataset:
  source: datasets/dsat.csv
  split_config: configs/data/dataset.yaml
  feature_catalog: configs/features/features.yaml
  feature_set: set2
  cleaner: photoz.data.tabular:clean_dataset
workers: 2
methods:
  catboost: {kind: tabular, recipe: configs/tabular/catboost.yaml}
  llr: {kind: tabular, recipe: configs/tabular/llr.yaml}
  mlp: {kind: tabular, recipe: configs/tabular/mlp.yaml}
  rf: {kind: tabular, recipe: configs/tabular/rf.yaml}
