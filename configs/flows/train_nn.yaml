name: train_nn
output: runs/train_nn
task: photoz.report:PHOTOZ
methods:
  efficientnet_b0:
    kind: lightning
    recipe: configs/nn/efficientnet_b0.yaml
    predict_on: &teddy_splits
      B:
        images: teddyB_imgs
        catalog: datasets/teddy_happy_orig/Teddy/teddy_B
      C:
        images: teddyC_imgs
        catalog: datasets/teddy_happy_orig/Teddy/teddy_C
      D:
        images: teddyD_imgs
        catalog: datasets/teddy_happy_orig/Teddy/teddy_D
    report:
      id_column: object_id
  vit_tiny:
    kind: lightning
    recipe: configs/nn/vit_tiny.yaml
    predict_on: *teddy_splits
    report:
      id_column: object_id
