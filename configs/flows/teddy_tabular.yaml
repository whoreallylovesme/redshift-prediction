name: Teddy tabular A to B, C and D
task: photoz.report:PHOTOZ
output: runs/teddy_tabular
workers: 2
dataset:
  source: datasets/teddy_happy_orig/Teddy/teddy_A.parquet
  feature_catalog: configs/features/features_teddy_happy.yaml
  feature_set: set3
  evaluation_files:
    B: datasets/teddy_happy_orig/Teddy/teddy_B.parquet
    C: datasets/teddy_happy_orig/Teddy/teddy_C.parquet
    D: datasets/teddy_happy_orig/Teddy/teddy_D.parquet
methods:
  catboost: {kind: tabular, recipe: configs/tabular/teddy_happy/catboost.yaml}
  rf: {kind: tabular, recipe: configs/tabular/teddy_happy/rf.yaml}
  gam: {kind: tabular, recipe: configs/tabular/teddy_happy/gam.yaml}
  llr: {kind: tabular, recipe: configs/tabular/teddy_happy/llr.yaml}
  mlp: {kind: tabular, recipe: configs/tabular/teddy_happy/mlp.yaml}
