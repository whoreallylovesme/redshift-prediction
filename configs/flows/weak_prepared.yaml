name: Euclid weak prepared photometry baseline
task: photoz.report:PHOTOZ
output: runs/weak_prepared
dataset:
  reader: photoz.data.weak:load_prepared
  source: configs/photoz/weak_prepared.yaml
  id_column: object_id
  target: z_train
  weight_column: sample_weight
  features: [flux_u, flux_g, flux_r, flux_i, flux_z, flux_vis, flux_y, flux_j, flux_h]
  split_column: split
  train_label: train
  test_label: valid
methods:
  weighted_catboost:
    kind: tabular
    recipe: configs/tabular/catboost_fast_test.yaml
    split: weak_validation
    report: {id_column: object_id, role: validation}
