model_type: lightning
training_task: photoz.training.regression:photoz_regression_task

estimator: vit_tiny
estimator_params: {image_channels: 4}

data_dir: teddyA_imgs
catalog: datasets/teddy_happy_orig/Teddy/teddy_A
norm_from: teddyA_imgs

train:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  freeze_epochs: 3
  train_ratio: 0.8
  seed: 42
  num_workers: 4
  weighted_sampling: true
  z_weight_alpha: 2.0
  label_noise: 0.0
  head_prefix: head
