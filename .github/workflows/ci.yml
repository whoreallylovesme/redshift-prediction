name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --extra tracking
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run --extra tracking python -m unittest discover -s tests
      - run: uv run python -m runtime.pipeline --config examples/configs/teddy.yaml --check
      - run: uv run python -m runtime.pipeline --config examples/configs/euclid.yaml --check
      - run: uv build
